name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Build admin
        run: pnpm --filter blog-background build

      - name: Verify backend
        working-directory: blog-server
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check
          node --test utils/RSS.test.js

      - name: Prepare release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/prepare-release.js

      - name: Upload release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EXPECTED_HOST_FINGERPRINT: SHA256:ZM4CmqQigBKE9WWi96llehosKiS31hqiqPNTZRO//bs
    steps:
      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-release-${{ github.sha }}
          path: release

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          echo "Preparing SSH credentials and verifying the production host..."
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          known_hosts_file="$(mktemp)"
          for attempt in 1 2 3; do
            echo "Host key scan attempt ${attempt}/3..."
            if ssh-keyscan -T 15 -p "${REMOTE_PORT}" -t ed25519 "${REMOTE_HOST}" > "${known_hosts_file}" 2>/dev/null; then
              break
            fi
            sleep $((attempt * 3))
          done

          test -s "${known_hosts_file}"
          actual_fingerprint="$(ssh-keygen -lf "${known_hosts_file}" -E sha256 | awk 'NR == 1 { print $2 }')"
          if [[ "${actual_fingerprint}" != "${EXPECTED_HOST_FINGERPRINT}" ]]; then
            echo "::error::SSH host fingerprint mismatch"
            exit 1
          fi
          mv "${known_hosts_file}" ~/.ssh/known_hosts
          echo "SSH host fingerprint verified."

      - name: Transfer release with retry
        run: |
          set -Eeuo pipefail
          remote_dir="/var/www/.incoming-${GITHUB_SHA}"
          ssh_options=(
            -i "${HOME}/.ssh/deploy_key"
            -p "${REMOTE_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
          )
          rsync_ssh="ssh -i ${HOME}/.ssh/deploy_key -p ${REMOTE_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"

          echo "Preparing the incoming release directory on the server..."
          ssh "${ssh_options[@]}" "${REMOTE_USER}@${REMOTE_HOST}" \
            "rm -rf '${remote_dir}' && mkdir -p '${remote_dir}' && \
             cp -al /var/www/frontend '${remote_dir}/frontend' && \
             cp -al /var/www/admin '${remote_dir}/admin'"
          echo "Incoming release directory is ready."

          transferred=false
          for attempt in 1 2 3; do
            echo "Starting release transfer (attempt ${attempt}/3)..."
            if rsync --archive --compress --delete --partial --human-readable \
              --info=progress2,stats2 \
              --timeout=120 \
              -e "${rsync_ssh}" \
              release/ "${REMOTE_USER}@${REMOTE_HOST}:${remote_dir}/"; then
              transferred=true
              echo "Release transfer completed successfully."
              break
            fi
            echo "::warning::Release transfer attempt ${attempt}/3 failed."
            sleep $((attempt * 5))
          done

          if [[ "${transferred}" != true ]]; then
            echo "::error::Release transfer failed after three attempts"
            exit 1
          fi

      - name: Activate release
        run: |
          set -Eeuo pipefail
          echo "Starting remote release activation..."
          ssh -i ~/.ssh/deploy_key \
            -p "${REMOTE_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${REMOTE_USER}@${REMOTE_HOST}" \
            "bash '/var/www/.incoming-${GITHUB_SHA}/deploy-release.sh' '${GITHUB_SHA}'"
          echo "Remote release activation completed."

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
