name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      components: ${{ steps.changes.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            FORCE_ALL=true node scripts/detect-deploy-components.js </dev/null
          else
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              base_sha="${PR_BASE_SHA}"
            else
              base_sha="${BEFORE_SHA}"
            fi

            if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
              FORCE_ALL=true node scripts/detect-deploy-components.js </dev/null
            else
              echo "Changed files between ${base_sha} and ${GITHUB_SHA}:"
              git diff --name-only -z "${base_sha}" "${GITHUB_SHA}" \
                | node scripts/detect-deploy-components.js
            fi
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.has_changes == 'true'
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BUILD_FRONTEND: ${{ steps.changes.outputs.frontend }}
          BUILD_ADMIN: ${{ steps.changes.outputs.admin }}
          BUILD_SERVER: ${{ steps.changes.outputs.server }}
        run: |
          set -Eeuo pipefail
          filters=()
          [[ "${BUILD_FRONTEND}" == true ]] && filters+=(--filter=frontend)
          [[ "${BUILD_ADMIN}" == true ]] && filters+=(--filter=blog-background)
          [[ "${BUILD_SERVER}" == true ]] && filters+=(--filter=backend)
          pnpm "${filters[@]}" install --frozen-lockfile

      - name: Audit production dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: pnpm audit --prod --audit-level high

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          pnpm --filter frontend build
          node scripts/report-bundle-size.js frontend | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build admin
        if: steps.changes.outputs.admin == 'true'
        run: |
          pnpm --filter blog-background build
          node scripts/report-bundle-size.js admin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test admin upload behavior
        if: steps.changes.outputs.admin == 'true'
        run: pnpm --filter blog-background test

      - name: Verify backend
        if: steps.changes.outputs.server == 'true'
        working-directory: blog-server
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check
          node --test utils/*.test.js

      - name: Verify deployment scripts
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          bash -n scripts/deploy-release.sh
          node --check scripts/prepare-release.js
          node --test scripts/*.test.js

      - name: Prepare release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.has_changes == 'true'
        env:
          DEPLOY_COMPONENTS: ${{ steps.changes.outputs.components }}
        run: node scripts/prepare-release.js

      - name: Upload release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.has_changes == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EXPECTED_HOST_FINGERPRINT: SHA256:ZM4CmqQigBKE9WWi96llehosKiS31hqiqPNTZRO//bs
    steps:
      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-release-${{ github.sha }}
          path: release

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          echo "Preparing SSH credentials and verifying the production host..."
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          known_hosts_file="$(mktemp)"
          for attempt in 1 2 3; do
            echo "Host key scan attempt ${attempt}/3..."
            if ssh-keyscan -T 15 -p "${REMOTE_PORT}" -t ed25519 "${REMOTE_HOST}" > "${known_hosts_file}" 2>/dev/null; then
              break
            fi
            sleep $((attempt * 3))
          done

          test -s "${known_hosts_file}"
          actual_fingerprint="$(ssh-keygen -lf "${known_hosts_file}" -E sha256 | awk 'NR == 1 { print $2 }')"
          if [[ "${actual_fingerprint}" != "${EXPECTED_HOST_FINGERPRINT}" ]]; then
            echo "::error::SSH host fingerprint mismatch"
            exit 1
          fi
          mv "${known_hosts_file}" ~/.ssh/known_hosts
          echo "SSH host fingerprint verified."

      - name: Transfer release with retry
        run: |
          set -Eeuo pipefail
          remote_dir="/var/www/.incoming-${GITHUB_SHA}"
          ssh_options=(
            -i "${HOME}/.ssh/deploy_key"
            -p "${REMOTE_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
          )
          rsync_ssh="ssh -i ${HOME}/.ssh/deploy_key -p ${REMOTE_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20"

          echo "Preparing the incoming release directory on the server..."
          remote_prepare="rm -rf '${remote_dir}' && mkdir -p '${remote_dir}'"
          if [[ -d release/frontend ]]; then
            remote_prepare+=" && cp -al /var/www/frontend '${remote_dir}/frontend'"
          fi
          if [[ -d release/admin ]]; then
            remote_prepare+=" && cp -al /var/www/admin '${remote_dir}/admin'"
          fi
          ssh "${ssh_options[@]}" "${REMOTE_USER}@${REMOTE_HOST}" \
            "${remote_prepare}"
          echo "Incoming release directory is ready."

          transferred=false
          for attempt in 1 2 3; do
            echo "Starting release transfer (attempt ${attempt}/3)..."
            if rsync --archive --compress --delete --partial --human-readable \
              --info=progress2,stats2 \
              --timeout=120 \
              -e "${rsync_ssh}" \
              release/ "${REMOTE_USER}@${REMOTE_HOST}:${remote_dir}/"; then
              transferred=true
              echo "Release transfer completed successfully."
              break
            fi
            echo "::warning::Release transfer attempt ${attempt}/3 failed."
            sleep $((attempt * 5))
          done

          if [[ "${transferred}" != true ]]; then
            echo "::error::Release transfer failed after three attempts"
            exit 1
          fi

      - name: Activate release
        run: |
          set -Eeuo pipefail
          echo "Starting remote release activation..."
          ssh -i ~/.ssh/deploy_key \
            -p "${REMOTE_PORT}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${REMOTE_USER}@${REMOTE_HOST}" \
            "bash '/var/www/.incoming-${GITHUB_SHA}/deploy-release.sh' '${GITHUB_SHA}'"
          echo "Remote release activation completed."

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
